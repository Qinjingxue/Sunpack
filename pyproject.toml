[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunpack"
version = "0.8.0"
description = "Archive detection, extraction, and verification pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "psutil>=5.9.0",
    "send2trash>=1.8.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
build = [
    "nuitka>=2",
    "maturin>=1.8,<2",
    "cmake>=3.25",
]
test = ["pytest>=9", "pytest-xdist>=3.8", "zstandard>=0.22.0"]
dev = [
    "nuitka>=2",
    "maturin>=1.8,<2",
    "cmake>=3.25",
    "pytest>=9",
    "pytest-xdist>=3.8",
    "zstandard>=0.22.0",
]

[project.scripts]
sunpack = "sunpack.cli.cli:main"

[tool.setuptools.packages.find]
include = ["sunpack*"]
