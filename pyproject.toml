[project]
name = "sunpack"
version = "1.0.0"
description = "Archive detection, extraction, and recovery pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
build = [
    "cmake>=3.25",
]
test = [
    "psutil>=5.9.0",
    "pytest>=9",
    "pytest-xdist>=3.8",
]
dev = [
    "sunpack[build,test]",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
tmp_path_retention_policy = "none"
