[package]
name = "sunpack-native"
edition = "2021"
license = "MIT"

[lib]
name = "sunpack_native"
crate-type = ["cdylib"]

[dependencies]
aho-corasick = "1.1"
aes = "0.9"
base64 = "0.22"
bzip2 = "0.4"
cbc = "0.2"
flate2 = "1.0"
crc32fast = "1.4"
encoding_rs = "0.8"
hmac = "0.12"
lzma-rust2 = "0.16"
memchr = "2.7"
pbkdf2 = "0.12"
pyo3 = { version = "0.29", features = ["extension-module"] }
regex = "1.11"
rayon = "1.10"
sevenz-rust2 = { version = "0.21", default-features = false, features = ["aes256", "compress"] }
sha1 = "0.10"
sha2 = "0.10"
sha2_11 = { package = "sha2", version = "0.11" }
sunpack-usn-core = { path = "../sunpack_usn_core", default-features = false, features = ["client"] }
xz2 = "0.1"
zstd = "0.13"
unicode-normalization = "0.1"
