[package]
name = "sunpack-native"
edition = "2021"
license = "MIT"

[lib]
name = "sunpack_native"
crate-type = ["rlib"]

[dependencies]
sunpack-enc = { path = "../sunpack_enc" }
aho-corasick = "1.1"
aes = "0.9"
base64 = "0.22"
bzip2 = "0.4"
cbc = "0.2"
flate2 = "1.0"
crc32fast = "1.4"
encoding_rs = "0.8"
hmac = "0.12"
lzma-rust2 = "0.16"
memchr = "2.7"
pbkdf2 = "0.12"
regex = "1.11"
regex-automata = "0.4"
regex-syntax = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sevenz-rust2 = { version = "0.21", default-features = false, features = ["aes256", "compress"] }
sha1 = "0.10"
sha2 = "0.10"
sha2_11 = { package = "sha2", version = "0.11" }
sunpack-usn-core = { path = "../sunpack_usn_core", default-features = false, features = ["client"] }
xz2 = "0.1"
zstd = "0.13"
unicode-normalization = "0.1"
rmp-serde = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory",
    "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading",
    "Win32_System_SystemInformation", "Win32_System_Time",
    "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1"
