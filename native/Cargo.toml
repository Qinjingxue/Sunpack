[workspace]
members = [
    "sunpack_enc",
    "sunpack_native",
    "sunpack_usn_core",
    "sunpack_watch_broker",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Correctness tests keep optimization but avoid the final release link cost.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = false
