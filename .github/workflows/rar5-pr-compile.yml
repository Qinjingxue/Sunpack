name: Temporary RAR5 native compile

on:
  pull_request:
    paths:
      - "native/sevenzip_bridge/**"
      - ".github/workflows/rar5-pr-compile.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Configure native bridge
        shell: pwsh
        run: cmake -S native/sevenzip_bridge -B native/sevenzip_bridge/build-rar5-ci -A x64
      - name: Build native bridge
        shell: pwsh
        run: cmake --build native/sevenzip_bridge/build-rar5-ci --config Release --parallel 2
