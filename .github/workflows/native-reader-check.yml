name: Native reader branch check

on:
  push:
    branches:
      - perf/shared-request-read-cache
    paths:
      - "native/sunpack_native/**"
      - ".github/workflows/native-reader-check.yml"

permissions:
  contents: read

jobs:
  reader:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust test compilation
        shell: pwsh
        run: cargo check --manifest-path native/sunpack_native/Cargo.toml --tests
      - name: Reader unit tests
        shell: pwsh
        run: cargo test --manifest-path native/sunpack_native/Cargo.toml io::reader::tests --lib -- --nocapture
