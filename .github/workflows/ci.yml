name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (space gate / space retry / async output / smoke / writer cost)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Prepare native/tool environment
        shell: pwsh
        # lite: this lane does no model work, so the full repair-system would be dead weight.
        run: .\scripts\setup_windows_dev.ps1 -Arch x64 -RepairSystem lite -SkipAcceptanceTestTools

      - name: Configure
        shell: pwsh
        run: |
          $cmake = Join-Path $PWD ".venv\Scripts\cmake.exe"
          if (-not (Test-Path -LiteralPath $cmake)) { $cmake = "cmake" }
          & $cmake -S native\sevenzip_bridge -B native\sevenzip_bridge\build-x64

      - name: Build
        shell: pwsh
        run: |
          $cmake = Join-Path $PWD ".venv\Scripts\cmake.exe"
          if (-not (Test-Path -LiteralPath $cmake)) { $cmake = "cmake" }
          & $cmake --build native\sevenzip_bridge\build-x64 --config Release
          if ($LASTEXITCODE -ne 0) { throw "native build failed" }

      # Each target runs separately so a single failure fails the job.
      - name: Run native tests
        shell: pwsh
        run: |
          $rel = "native\sevenzip_bridge\build-x64\Release"
          $targets = @(
            "sunpack_sevenzip_async_output",
            "sunpack_sevenzip_smoke",
            "sunpack_sevenzip_writer_cost",
            "sunpack_sevenzip_space_gate",
            "sunpack_sevenzip_space_retry"
          )
          $failed = @()
          foreach ($target in $targets) {
            Write-Host "=== $target ==="
            & (Join-Path $rel "$target.exe")
            if ($LASTEXITCODE -ne 0) { $failed += $target }
          }
          if ($failed.Count -gt 0) { throw "native tests failed: $($failed -join ', ')" }

      # Space-class error codes may be classified in exactly one place.
      - name: Vocabulary and single-classification-point checks
        shell: pwsh
        run: |
          $forbidden = 'WriteOutcome|OpenOutcome|SpaceRetryResult|last_space_error|out_space_error'
          $hits = Select-String -Path "native\sevenzip_bridge\src\internal\*.hpp","native\sevenzip_bridge\src\internal\*.cpp","native\sevenzip_bridge\src\*.cpp" `
            -Pattern $forbidden -ErrorAction SilentlyContinue |
            Where-Object { $_.Line -notmatch '^\s*//' -and $_.Line -notmatch '✗|禁止' }
          if ($hits) { $hits | ForEach-Object { Write-Host $_ }; throw "forbidden vocabulary found" }

          $codes = Select-String -Path "native\sevenzip_bridge\src\internal\*.hpp","native\sevenzip_bridge\src\internal\*.cpp" `
            -Pattern 'case ERROR_DISK_FULL|case ERROR_HANDLE_DISK_FULL|case ERROR_DISK_QUOTA_EXCEEDED|case ERROR_DISK_RESOURCES_EXHAUSTED' `
            -ErrorAction SilentlyContinue
          $offenders = $codes | Where-Object { $_.Path -notmatch 'sevenzip_space_error\.hpp$' }
          if ($offenders) { $offenders | ForEach-Object { Write-Host $_ }; throw "space error codes classified outside sevenzip_space_error.hpp" }

  python:
    name: Python (unit / functional / cli + worker extraction)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # The real-worker tests need the native artifacts.
      - name: Prepare native/tool environment
        shell: pwsh
        # lite: this lane does no model work, so the full repair-system would be dead weight.
        run: .\scripts\setup_windows_dev.ps1 -Arch x64 -RepairSystem lite -SkipAcceptanceTestTools

      # setup_windows_dev.ps1 already builds and copies the worker, its 7z wrapper and
      # 7z.dll into tools/; there is no separate build step here.
      - name: Verify worker artifacts
        shell: pwsh
        run: |
          & .venv\Scripts\python.exe -c "from sunpack.support.resources import get_sevenzip_bridge_worker_path, get_7z_dll_path; import os, sys; w = get_sevenzip_bridge_worker_path(); d = get_7z_dll_path(); print('worker:', w); print('7z.dll:', d); sys.exit(0 if os.path.exists(w) and os.path.exists(d) else 1)"
          if ($LASTEXITCODE -ne 0) { throw "native worker artifacts missing after setup" }

      - name: Run test suite
        shell: pwsh
        run: .\scripts\run_ci_tests.ps1 -ParallelWorkers 2

      - name: Space event contract tests
        shell: pwsh
        run: |
          & .venv\Scripts\python.exe -m pytest -q tests/unit/test_volume_space_events.py

  # Manual/nightly lane: needs administrator rights to create and attach VHDs.
  vhd-lane:
    name: L4 real disk-full end-to-end (VHD, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Prepare native/tool environment
        shell: pwsh
        # lite: this lane does no model work, so the full repair-system would be dead weight.
        run: .\scripts\setup_windows_dev.ps1 -Arch x64 -RepairSystem lite -SkipAcceptanceTestTools

      # No separate build step: setup_windows_dev.ps1 already produces the worker,
      # its 7z wrapper and 7z.dll in tools/.
      - name: Verify worker artifacts
        shell: pwsh
        run: |
          & .venv\Scripts\python.exe -c "from sunpack.support.resources import get_sevenzip_bridge_worker_path, get_7z_dll_path; import os, sys; w = get_sevenzip_bridge_worker_path(); d = get_7z_dll_path(); print('worker:', w); print('7z.dll:', d); sys.exit(0 if os.path.exists(w) and os.path.exists(d) else 1)"
          if ($LASTEXITCODE -ne 0) { throw "native worker artifacts missing after setup" }

      # Each test creates, fills, releases and deletes its own VHD under the runner temp drive.
      - name: Real disk-full end-to-end
        shell: pwsh
        env:
          SUNPACK_SPACE_TEST_VHD: "1"
        run: |
          & .venv\Scripts\python.exe -m pytest -q tests\integration\test_disk_full_pause_resume.py
          if ($LASTEXITCODE -ne 0) { throw "L4 disk-full end-to-end failed" }
