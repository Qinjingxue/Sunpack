name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for a manual Release (e.g. v1.1.11), or just a package version label when not publishing."
        required: false
        type: string
      publish_release:
        description: "Publish a GitHub Release when manually running this workflow (tag pushes always publish)."
        required: false
        default: false
        type: boolean
      fast_build:
        description: "Skip Nuitka LTO for manual build-only runs. Publishing always uses full optimization."
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.release_tag || 'artifact' }}
  cancel-in-progress: false

jobs:
  build-notes:
    name: Generate build notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.notes.outputs.release_tag }}
      target_sha: ${{ steps.notes.outputs.target_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate notes from commits
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IS_TAG_REF: ${{ startsWith(github.ref, 'refs/tags/') }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag || '' }}
          SHOULD_PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        run: |
          set -euo pipefail
          git fetch --force --prune --tags
          git fetch --force origin +refs/heads/main:refs/remotes/origin/main

          target="$(git rev-parse HEAD)"
          current_tag=""
          if [[ "${IS_TAG_REF}" == "true" ]]; then
            current_tag="${REF_NAME}"
            if [[ -n "${RELEASE_TAG_INPUT}" && "${RELEASE_TAG_INPUT}" != "${current_tag}" ]]; then
              echo "The manually entered tag differs from the selected tag ref." >&2
              exit 1
            fi
          elif [[ -n "${RELEASE_TAG_INPUT}" ]]; then
            current_tag="${RELEASE_TAG_INPUT}"
          fi

          if [[ "${SHOULD_PUBLISH}" == "true" ]]; then
            if [[ "${IS_TAG_REF}" != "true" && ! "${current_tag}" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]; then
              echo "Publishing requires a version tag such as v1.1.11." >&2
              exit 1
            fi
            existing_commit="$(git rev-parse --verify --quiet "refs/tags/${current_tag}^{commit}" || true)"
            if [[ -n "${existing_commit}" && "${existing_commit}" != "${target}" ]]; then
              echo "Tag ${current_tag} points to ${existing_commit}, but this run builds ${target}." >&2
              echo "Select the matching tag ref in Run workflow, or choose a new tag." >&2
              exit 1
            fi
            if [[ "${IS_TAG_REF}" != "true" ]] && ! git merge-base --is-ancestor "${target}" refs/remotes/origin/main; then
              echo "Manual publishing must build a commit on main." >&2
              exit 1
            fi
          fi

          # Choose the most recently published Release on main, rather than a nearby tag.
          # This repository's Releases record an immutable commit SHA as target_commitish.
          releases="$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .published_at != null) | [.published_at, .tag_name, .target_commitish] | @tsv' | sort -r)"

          previous_version=""
          previous_commit=""
          while IFS=$'\t' read -r published_at version commit; do
            [[ -n "${published_at}" && -n "${version}" ]] || continue
            [[ "${version}" != "${current_tag}" ]] || continue
            [[ "${commit}" =~ ^[0-9a-fA-F]{40}$ ]] || continue
            git cat-file -e "${commit}^{commit}" 2>/dev/null || continue
            git merge-base --is-ancestor "${commit}" refs/remotes/origin/main || continue
            git merge-base --is-ancestor "${commit}" "${target}" || continue
            previous_version="${version}"
            previous_commit="${commit}"
            break
          done <<< "${releases}"

          range="${target}"
          if [[ -n "${previous_commit}" ]]; then
            range="${previous_commit}..${target}"
          fi

          {
            echo "# SunPack build notes"
            echo
            if [[ -n "${current_tag}" ]]; then
              echo "Build version: ${current_tag}"
            else
              echo "Build ref: ${REF_NAME}"
            fi
            echo "Commit: ${target}"
            if [[ -n "${previous_version}" ]]; then
              echo "Changes since published Release: ${previous_version}"
            else
              echo "Changes since: initial history"
            fi
            echo
            echo "## Commits"
          } > build-notes.md

          commits="$(git log --format='- %s (%h)' "${range}")"
          if [[ -n "${commits}" ]]; then
            printf '%s\n' "${commits}" >> build-notes.md
          else
            echo "- No commits since the previous published Release." >> build-notes.md
          fi

          echo "release_tag=${current_tag}" >> "${GITHUB_OUTPUT}"
          echo "target_sha=${target}" >> "${GITHUB_OUTPUT}"

      - name: Upload build notes
        uses: actions/upload-artifact@v7
        with:
          name: sunpack-build-notes
          path: build-notes.md
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.arch }}
    needs: build-notes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python_version: "3.11"
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            python_arch: arm64
            python_version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.python_arch }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup target add ${{ matrix.rust_target }}
          cargo --version
          rustc -Vv

      - name: Restore native build cache
        id: native-cache
        uses: ./.github/actions/native-cache
        with:
          arch: ${{ matrix.arch }}
          profile: release
          python-version: ${{ matrix.python_version }}
          source-key: ${{ hashFiles('native/**', 'scripts/**', 'sunpack.manifest') }}

      - name: Restore Nuitka compiler cache
        uses: actions/cache@v4
        with:
          path: .cache/nuitka/${{ matrix.arch }}
          key: nuitka-v1-${{ runner.os }}-${{ matrix.arch }}-py${{ matrix.python_version }}-${{ steps.native-cache.outputs.toolchain }}-${{ hashFiles('uv.lock') }}-${{ github.event_name == 'workflow_dispatch' && !inputs.publish_release && inputs.fast_build && 'fast' || 'lto' }}-${{ hashFiles('sunpack/**', 'sunpack.py', 'scripts/build_windows.ps1') }}
          restore-keys: |
            nuitka-v1-${{ runner.os }}-${{ matrix.arch }}-py${{ matrix.python_version }}-${{ steps.native-cache.outputs.toolchain }}-${{ hashFiles('uv.lock') }}-${{ github.event_name == 'workflow_dispatch' && !inputs.publish_release && inputs.fast_build && 'fast' || 'lto' }}-

      - name: Bootstrap Python and external tools
        shell: pwsh
        run: |
          .\scripts\setup_windows_dev.ps1 -Arch ${{ matrix.arch }} -SkipAcceptanceTestTools -BootstrapOnly

      - name: Show toolchain architecture
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -c "import platform, sys; print(sys.version); print(platform.machine())"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"

      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install innosetup --yes --no-progress
            } elseif (Get-Command winget -ErrorAction SilentlyContinue) {
              winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
            } else {
              throw "Neither Chocolatey nor winget is available to install Inno Setup."
            }
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup installation completed but ISCC.exe was not found."
          }
          Write-Host "Inno Setup compiler: $iscc"

      - name: Build Windows package
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag || '' }}
          GIT_EVENT_NAME: ${{ github.event_name }}
          GIT_REF_NAME: ${{ github.ref_name }}
          IS_TAG_REF: ${{ startsWith(github.ref, 'refs/tags/') }}
          FAST_BUILD: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_release && inputs.fast_build && 'true' || 'false' }}
          NUITKA_CACHE_DIR: ${{ github.workspace }}\.cache\nuitka\${{ matrix.arch }}
          CLCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          $version = ""
          if ($env:GIT_EVENT_NAME -eq "workflow_dispatch" -and $env:RELEASE_TAG_INPUT) {
            $version = $env:RELEASE_TAG_INPUT.Trim()
          } elseif ($env:IS_TAG_REF -eq "true") {
            $version = $env:GIT_REF_NAME
          }
          if ($version -match '[\\/:*?"<>|]') {
            throw "Release version contains characters that are invalid in a Windows package filename: $version"
          }

          $buildArgs = @{
            SkipTests = $true
            NoPause = $true
            Arch = "${{ matrix.arch }}"
            BuildJobs = 4
            FastBuild = ($env:FAST_BUILD -eq "true")
          }
          if ($version -ne "") {
            $buildArgs.Version = $version
          }
          .\scripts\build_windows.ps1 @buildArgs

      - name: Validate release package
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem -LiteralPath "release" `
              -Filter "sunpack-windows-${{ matrix.arch }}-*-setup.exe" `
              -File
          )
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer; found $($installers.Count)."
          }
          Write-Host "Windows installer: $($installers[0].FullName)"

      - name: Verify package architecture
        shell: pwsh
        run: |
          $packageRoot = "dist\sunpack-${{ matrix.arch }}"
          .\scripts\verify_windows_package_arch.ps1 -PackageRoot $packageRoot -Arch ${{ matrix.arch }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: sunpack-windows-${{ matrix.arch }}
          path: release/sunpack-windows-${{ matrix.arch }}-*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  acceptance:
    name: Acceptance Tests
    needs: build-notes
    uses: ./.github/workflows/acceptance.yml

  release:
    name: Publish GitHub Release
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    needs:
      - build-notes
      - build
      - acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Download build notes
        uses: actions/download-artifact@v8
        with:
          name: sunpack-build-notes
          path: release-notes

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.build-notes.outputs.release_tag }}
          RELEASE_TARGET: ${{ needs.build-notes.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find artifacts -type f -name 'sunpack-windows-*-setup.exe' | sort)
          if [ "${#packages[@]}" -ne 2 ]; then
            echo "Expected two Windows installers, found ${#packages[@]}." >&2
            exit 1
          fi
          for package in x64 arm64; do
            if ! printf '%s\n' "${packages[@]}" | grep -Eq "/sunpack-windows-${package}-.*-setup\.exe$"; then
              echo "Missing ${package} Windows installer." >&2
              exit 1
            fi
          done

          : > SHA256SUMS.txt
          for package in "${packages[@]}"; do
            hash="$(sha256sum "${package}" | awk '{print $1}')"
            printf '%s  %s\n' "${hash}" "$(basename "${package}")" >> SHA256SUMS.txt
          done
          release_assets=("${packages[@]}" "SHA256SUMS.txt")

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --notes-file release-notes/build-notes.md
            gh release upload "${TAG_NAME}" "${release_assets[@]}" --clobber
          else
            release_args=(release create "${TAG_NAME}" "${release_assets[@]}" --title "${TAG_NAME}" --notes-file release-notes/build-notes.md --target "${RELEASE_TARGET}")
            gh "${release_args[@]}"
          fi
