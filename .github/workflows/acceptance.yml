name: Acceptance Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    name: Acceptance Tests
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          cargo --version
          rustc -Vv

      - name: Restore native build cache
        id: native-cache
        uses: ./.github/actions/native-cache
        with:
          arch: x64
          profile: ci
          source-key: ${{ hashFiles('native/**', 'scripts/**', '!scripts/build_gui.ps1', 'sunpack.manifest', 'sunpack.ico', 'sunpack_advanced_config.json') }}

      - name: Cache real archive generators
        uses: actions/cache@v4
        with:
          path: .sunpack_test_tools
          key: acceptance-tools-v1-${{ runner.os }}-x64-${{ hashFiles('scripts/setup_windows_dev.ps1') }}

      - name: Prepare acceptance environment
        shell: pwsh
        run: |
          .\scripts\setup_windows_dev.ps1 -Arch x64 -BuildProfile ci -BuildJobs 4

      - name: Build real writer test executable for GUI contracts
        shell: pwsh
        run: |
          $artifacts = & cargo test --locked --manifest-path native/Cargo.toml -p sunpack-native --lib --no-run --profile ci --target x86_64-pc-windows-msvc --target-dir .cache/rust-target/x64 --message-format=json | ForEach-Object { $_ | ConvertFrom-Json }
          if ($LASTEXITCODE -ne 0) { throw 'Rust GUI writer test build failed' }
          $writer = @($artifacts | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'sunpack_native' -and $_.executable })
          if ($writer.Count -ne 1) { throw 'Expected exactly one Rust lib test executable' }
          New-Item -ItemType Directory -Path tools -Force | Out-Null
          Copy-Item -LiteralPath $writer[0].executable -Destination tools/gui_projection_writer.exe -Force

      - name: Save native build cache after successful compilation
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/rust-target/x64
            .cache/native-source-times-x64-ci.json
            native/sevenzip_bridge/build-x64-ci
            native/toast_host/build-x64-ci
          key: ${{ steps.native-cache.outputs.cache-key }}

      - name: Upload native runtime for GUI contracts
        uses: actions/upload-artifact@v7
        with:
          name: sunpack-runtime-ci-x64
          include-hidden-files: true
          path: |
            .cache/rust-target/x64/x86_64-pc-windows-msvc/ci/sunpack-runtime.exe
            tools/gui_projection_writer.exe
            native/sevenzip_bridge/build-x64-ci/Release/sunpack_launcher.exe
            native/sevenzip_bridge/build-x64-ci/Release/sunpack_sevenzip_worker.exe
          if-no-files-found: error
          retention-days: 1

      - name: Run acceptance tests
        shell: pwsh
        env:
          SUNPACK_ACCEPTANCE_DIAGNOSTICS_DIR: ${{ github.workspace }}\.cache\acceptance-diagnostics
        run: |
          .\run_acceptance_tests.ps1 -NoWait -SkipEnvironmentRefresh -BuildProfile ci -ParallelWorkers 2 -StepTimeoutSeconds 900

      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-diagnostics
          path: .cache/acceptance-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  gui:
    name: GUI Native Build and Tests
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Prepare isolated GUI Python and CMake toolchain
        shell: pwsh
        run: |
          uv sync --locked --extra dev
          if ($LASTEXITCODE -ne 0) { throw 'GUI Python dependencies failed' }
          $venvScripts = Join-Path $PWD '.venv\Scripts'
          if (-not (Test-Path -LiteralPath (Join-Path $venvScripts 'cmake.exe'))) {
            throw 'Pinned GUI CMake binary not installed'
          }
          $venvScripts >> $env:GITHUB_PATH

      - name: Restore GUI build cache
        id: gui-cache
        uses: ./.github/actions/gui-cache
        with:
          arch: x64
          source-key: ${{ hashFiles('gui/**', 'tests/gui/**', 'scripts/build_gui.ps1', 'scripts/restore_native_cache_times.ps1', 'sunpack.manifest', 'sunpack_advanced_config.json', 'native/third_party/lz4/**') }}

      - name: Compile GUI and native tests
        shell: pwsh
        run: |
          .\scripts\build_gui.ps1 -Arch x64 -Jobs 4 -SkipTests

      - name: Save GUI build cache before running tests
        if: ${{ steps.gui-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/gui-x64
            .cache/gui-source-times-x64-release.json
          key: ${{ steps.gui-cache.outputs.cache-key }}

      - name: Upload GUI native contract binary
        uses: actions/upload-artifact@v7
        with:
          name: sunpack-gui-test-ci-x64
          path: .cache/gui-x64/Release/sunpack_gui_tests.exe
          if-no-files-found: error
          retention-days: 1

      - name: Run GUI CTest suite
        shell: pwsh
        run: |
          .\scripts\build_gui.ps1 -Arch x64 -TestsOnly -SkipPythonTests

  gui-python-contracts:
    name: GUI Python Integration Contracts
    needs: [acceptance, gui]
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Prepare Python test dependencies
        shell: pwsh
        run: uv sync --locked --extra dev

      - name: Download Rust runtime
        uses: actions/download-artifact@v8
        with:
          name: sunpack-runtime-ci-x64
          path: .

      - name: Download GUI native test binary
        uses: actions/download-artifact@v8
        with:
          name: sunpack-gui-test-ci-x64
          path: .cache/gui-x64/Release

      - name: Run GUI and runtime boundary tests
        shell: pwsh
        run: |
          $env:SUNPACK_GUI_TEST_BINARY = (Resolve-Path .cache/gui-x64/Release/sunpack_gui_tests.exe).Path
          $env:SUNPACK_GUI_WRITER_TEST_BINARY = (Resolve-Path tools/gui_projection_writer.exe).Path
          & .\.venv\Scripts\python.exe -m pytest -q tests/blackbox/test_runtime_commands.py::test_gui_password_edits_are_visible_to_running_runtime tests/gui/test_integration.py
          if ($LASTEXITCODE -ne 0) { throw 'GUI and runtime boundary tests failed' }
