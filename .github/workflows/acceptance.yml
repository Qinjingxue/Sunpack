name: Acceptance Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    name: Acceptance Tests
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare official ENC reference
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "SSEFilePC.zip"
          $extracted = Join-Path $env:RUNNER_TEMP "SSEFilePC-reference"
          Invoke-WebRequest -Uri "https://paranoiaworks.mobi/download/files/SSEFilePC.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted -Force
          $jars = @(Get-ChildItem -LiteralPath $extracted -Recurse -File -Filter "ssefenc.jar")
          if ($jars.Count -ne 1) {
            throw "Expected one ssefenc.jar in the official SSEFilePC.zip, found $($jars.Count)"
          }
          $dest = Join-Path $env:GITHUB_WORKSPACE "reference/implementations/SSEFilePC/S.S.E. File Encryptor for PC"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $referenceJar = Join-Path $dest "ssefenc.jar"
          Copy-Item -LiteralPath $jars[0].FullName -Destination $referenceJar -Force
          $jarEntries = & jar --list --file $referenceJar
          if ($LASTEXITCODE -ne 0 -or $jarEntries -notcontains "com/paranoiaworks/sse/Encryptor.class") {
            throw "The official SSE reference jar is invalid or incompatible with EncV4Fixtures.java"
          }
          Write-Host "Official SSE ENC reference is ready: $referenceJar"

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          cargo --version
          rustc -Vv

      - name: Restore native build cache
        uses: ./.github/actions/native-cache
        with:
          arch: x64
          profile: ci
          python-version: "3.11"
          source-key: ${{ hashFiles('native/**', 'scripts/**', 'sunpack.manifest') }}

      - name: Cache acceptance fixture generators
        uses: actions/cache@v4
        with:
          path: .sunpack_test_tools
          key: acceptance-tools-v1-${{ runner.os }}-x64-${{ hashFiles('scripts/setup_windows_dev.ps1') }}

      - name: Prepare acceptance environment
        shell: pwsh
        run: |
          .\scripts\setup_windows_dev.ps1 -Arch x64 -BuildProfile ci -BuildJobs 4

      - name: Run acceptance tests
        shell: pwsh
        run: |
          .\run_acceptance_tests.ps1 -NoWait -SkipEnvironmentRefresh -BuildProfile ci -ParallelWorkers 2 -StepTimeoutSeconds 900
