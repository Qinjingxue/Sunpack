name: "🗜️ 压缩包处理 / Archive Handling"
description: "识别、分卷、递归、解压和清理问题"
title: "[Archive] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: "SunPack 版本"
      placeholder: "例如：v1.2.2"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "问题描述"
      description: "实际发生了什么？你期望怎样处理？"
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: "相关文件（选填）"
      description: "可写文件格式、文件名与大小、分卷组成、嵌套结构；无需上传原文件。"
      placeholder: |
        sample.part1.rar (100 MiB)
        sample.part2.rar (100 MiB)

  - type: textarea
    id: logs
    attributes:
      label: "日志或样本（选填）"
      description: |
        安装版默认日志位置：
        处理记录：%ProgramData%\SunPack\.sunpack_watch\events.jsonl
        解压失败报告：%ProgramData%\SunPack\.sunpack_watch\failures\failed-*.txt

        若修改过 watch.state_dir，请到自定义状态目录查找。
        可粘贴日志或拖入截图、可公开样本；上传前请删除密码和私人信息。
