name: "✨ 功能建议 / Feature Request"
description: "提出功能或使用体验改进建议"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "使用场景与问题"
      description: "你在使用 SunPack 时遇到了什么不便？"
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: "希望如何改进？"
      description: "描述期望的效果即可，不需要提供技术实现方案。"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: "补充信息（选填）"
      description: "例如截图、使用示例或目前的替代办法。"
