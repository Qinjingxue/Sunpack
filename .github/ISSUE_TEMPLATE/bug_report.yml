name: "🐛 Bug 反馈 / Bug Report"
description: "GUI、Watch、安装及其他程序错误"
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: environment
    attributes:
      label: "版本与系统"
      placeholder: "例如：SunPack v1.2.2 / Windows 11 x64"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "问题描述"
      description: "实际发生了什么？你期望怎样？"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "复现步骤（选填）"
      description: "出现问题前进行了哪些操作？"

  - type: textarea
    id: logs
    attributes:
      label: "日志与截图（选填）"
      description: |
        安装版默认日志位置：
        Watch：%ProgramData%\SunPack\.sunpack_watch\events.jsonl
        解压失败：%ProgramData%\SunPack\.sunpack_watch\failures\failed-*.txt
        Windows 通知：%ProgramData%\SunPack\.sunpack_watch\toast_host_events.jsonl
        后台 Runtime：%ProgramData%\SunPack\runtime-*.state.events.jsonl

        若修改过 watch.state_dir，前三项在自定义状态目录下。
        可直接粘贴报错或拖入日志、截图；上传前请清除密码和私人信息。
